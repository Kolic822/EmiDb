<div class="page">
  <app-page-header [title]="'Filter wiring diagrams' | t" [subtitle]="subtitle()" backLink="/wiring-diagrams">
    @if (state.activeCriteriaCount() || state.query()) {
      <button mat-button (click)="state.clearCriteria()">{{ 'Clear all' | t }}</button>
    }
    <a mat-flat-button routerLink="/wiring-diagrams">
      <mat-icon>table_rows</mat-icon>
      {{ 'Show in table' | t }}
    </a>
  </app-page-header>

  <div class="page-body split">
    <aside class="card filters">
      <app-filter-panel [state]="state" [groups]="groups" />
    </aside>
    <app-data-table
      [state]="state"
      [rows]="rows()"
      [totalCount]="store.rows().length"
      [loading]="store.loading() && !store.loaded()"
      [showAttachments]="true"
      [selectable]="false"
      [emptyTitle]="'No diagrams match' | t"
      [emptyMessage]="'Clear a field to widen the search.' | t"
      (rowClick)="open($event)"
    />
  </div>
</div>
