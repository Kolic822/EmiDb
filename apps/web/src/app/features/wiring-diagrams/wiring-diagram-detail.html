<div class="page">
  @if (diagram(); as diagram) {
    <app-page-header [title]="diagram.name" [subtitle]="subtitle()" backLink="/wiring-diagrams">
      <a mat-stroked-button routerLink="/wiring-diagrams/new" [queryParams]="{ from: diagram.id }">
        <mat-icon>content_copy</mat-icon>
        {{ 'Duplicate' | t }}
      </a>
      <a mat-flat-button routerLink="edit">
        <mat-icon>edit</mat-icon>
        {{ 'Edit' | t }}
      </a>
      <button mat-icon-button (click)="remove()" [matTooltip]="'Delete diagram' | t" [attr.aria-label]="'Delete diagram' | t">
        <mat-icon>delete</mat-icon>
      </button>
    </app-page-header>

    <div class="page-scroll">
      <div class="layout" #layout [style.--split]="split()" [class.dragging]="dragging()">
        <app-entity-details [fields]="fields" [groups]="groups" [row]="diagram" />
        <div
          class="splitter"
          role="separator"
          aria-orientation="vertical"
          tabindex="0"
          [attr.aria-label]="'Resize columns' | t"
          [attr.aria-valuenow]="split()"
          aria-valuemin="30"
          aria-valuemax="78"
          (pointerdown)="startDrag($event, layout)"
          (dblclick)="resetSplit()"
          (keydown)="onSplitKey($event)"
        ></div>
        <aside class="files">
          <app-attachments-panel owner="wiringDiagram" [ownerId]="diagram.id" [inlinePreview]="true" />
        </aside>
      </div>
    </div>
  } @else if (missing()) {
    <app-empty-state icon="error" [title]="'Wiring diagram not found' | t">
      <a mat-stroked-button routerLink="/wiring-diagrams">{{ 'Back to diagrams' | t }}</a>
    </app-empty-state>
  }
</div>
