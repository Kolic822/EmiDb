<div class="page">
  <app-page-header [title]="'Filter pickups' | t" [subtitle]="subtitle()" backLink="/pickups">
    @if (state.activeCriteriaCount() || state.query()) {
      <button mat-button (click)="state.clearCriteria()">{{ 'Clear all' | t }}</button>
    }
    <button mat-stroked-button (click)="compare()" [disabled]="rows().length < 2 || rows().length > 8">
      <mat-icon>compare_arrows</mat-icon>
      {{ (selectedIds().length >= 2 ? 'Compare selected' : 'Compare results') | t }}
    </button>
    <a mat-flat-button routerLink="/pickups">
      <mat-icon>table_rows</mat-icon>
      {{ 'Show in table' | t }}
    </a>
  </app-page-header>

  <div class="page-body split">
    <aside class="card filters">
      <app-filter-panel [state]="state" [groups]="groups" />
    </aside>
    <app-data-table
      [state]="state"
      [rows]="rows()"
      [totalCount]="store.rows().length"
      [loading]="store.loading() && !store.loaded()"
      [showAttachments]="true"
      [emptyTitle]="'No pickups match' | t"
      [emptyMessage]="'Loosen a tolerance or clear a field.' | t"
      (rowClick)="open($event)"
    />
  </div>
</div>
