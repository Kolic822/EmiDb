<div class="head">
  <app-list-toolbar [state]="state" [searchPlaceholder]="searchPlaceholder()" (delete)="deleteSelected()" />
  <button mat-flat-button (click)="create()">
    <mat-icon>add</mat-icon>
    {{ createLabel | t }}
  </button>
</div>
<app-data-table
  [state]="state"
  [rows]="rows()"
  [totalCount]="store.rows().length"
  [loading]="store.loading() && !store.loaded()"
  [emptyTitle]="'No {noun}s yet' | t: { noun: noun | t }"
  (rowClick)="open($event)"
/>
