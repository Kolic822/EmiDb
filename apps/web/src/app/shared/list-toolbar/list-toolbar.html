<div class="toolbar">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search">
    <mat-icon matPrefix>search</mat-icon>
    <input
      matInput
      type="search"
      [placeholder]="searchPlaceholder()"
      [ngModel]="state().query()"
      (ngModelChange)="state().query.set($event)"
      autocomplete="off"
    />
    @if (state().query()) {
      <button matSuffix mat-icon-button [attr.aria-label]="'Clear search' | t" (click)="state().query.set('')">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  @if (chips().length) {
    <mat-chip-set [attr.aria-label]="'Active filters' | t">
      @for (chip of chips(); track chip.field.key) {
        <mat-chip (removed)="state().setCriterion(chip.field.key, undefined)">
          {{ chip.label }}
          <button matChipRemove [attr.aria-label]="'Remove {label} filter' | t: { label: chip.name }">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
    </mat-chip-set>
    <button type="button" class="link-btn" (click)="state().clearCriteria()">{{ 'Clear all' | t }}</button>
  }

  <span class="spacer"></span>

  @if (selectionCount()) {
    <div class="selection">
      <span class="count">{{ '{count} selected' | t: { count: selectionCount() } }}</span>
      <ng-content />
      <button mat-stroked-button class="danger" (click)="delete.emit()">
        <mat-icon>delete</mat-icon>
        {{ 'Delete' | t }}
      </button>
      <button mat-icon-button (click)="state().clearSelection()" [matTooltip]="'Clear selection' | t" [attr.aria-label]="'Clear selection' | t">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  }
</div>
