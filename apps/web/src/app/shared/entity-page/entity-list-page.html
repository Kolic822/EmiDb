<div class="page">
  <app-page-header [title]="title | t" [subtitle]="subtitle()">
    @if (supportsFilter) {
      <a mat-stroked-button routerLink="filter">
        <mat-icon>filter_alt</mat-icon>
        {{ 'Filter' | t }}
        @if (state.activeCriteriaCount()) {
          <span class="badge">{{ state.activeCriteriaCount() }}</span>
        }
      </a>
    }
    <app-column-picker [state]="state" [groups]="groups" />
    <button mat-flat-button (click)="create()">
      <mat-icon>add</mat-icon>
      {{ createLabel | t }}
    </button>

    <app-list-toolbar toolbar [state]="state" [searchPlaceholder]="searchPlaceholder()" (delete)="deleteSelected()">
      @if (supportsCompare) {
        <button mat-flat-button (click)="compare()" [disabled]="!canCompare()">
          <mat-icon>compare_arrows</mat-icon>
          {{ 'Compare' | t }}
        </button>
      }
    </app-list-toolbar>
  </app-page-header>

  <div class="page-body">
    <app-data-table
      [state]="state"
      [rows]="rows()"
      [totalCount]="store.rows().length"
      [loading]="store.loading() && !store.loaded()"
      [showAttachments]="supportsAttachments"
      [emptyTitle]="(store.rows().length ? 'No {noun}s match' : 'No {noun}s yet') | t: { noun: noun | t }"
      [emptyMessage]="(store.rows().length ? 'Try clearing a filter or the search.' : 'Add your first {noun} to get started.') | t: { noun: noun | t }"
      (rowClick)="open($event)"
    />
  </div>
</div>
