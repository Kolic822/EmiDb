# Render blueprint: connect the repository in Render and it creates this service.
# The disk keeps the SQLite database and uploaded files across deploys.
services:
  - type: web
    name: emidb
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/version
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      # Set a password in the Render dashboard (Environment → APP_PASSWORD) before sharing the URL.
      - key: APP_PASSWORD
        sync: false
    disk:
      name: emidb-data
      mountPath: /data
      sizeGB: 1
